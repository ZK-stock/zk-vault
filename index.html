<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ZK Vault - Online Canvas Tracker</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Inter, sans-serif;
            background:
                radial-gradient(
                    circle at top,
                    rgba(16,185,129,.10),
                    transparent 35%
                ),
                #020617;
            color: #e2e8f0;
        }

        .glass {
            background: rgba(15,23,42,.72);
            border: 1px solid rgba(148,163,184,.12);
            backdrop-filter: blur(16px);
        }

        .input {
            width: 100%;
            background: #020617;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 11px 13px;
            color: white;
            outline: none;
        }

        .input:focus {
            border-color: #10b981;
            box-shadow: 0 0 0 2px rgba(16,185,129,.12);
        }

        .btn {
            border-radius: 10px;
            padding: 10px 14px;
            font-weight: 600;
            transition: .2s;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn-green {
            background: #10b981;
            color: #022c22;
        }

        .btn-dark {
            background: #1e293b;
            color: #e2e8f0;
        }

        .btn-red {
            background: #7f1d1d;
            color: #fecaca;
        }

        .modal-bg {
            background: rgba(0,0,0,.72);
            backdrop-filter: blur(8px);
        }

        textarea {
            resize: vertical;
        }

        .project-card {
            transition: .2s;
        }

        .project-card:hover {
            transform: translateY(-2px);
            border-color: rgba(16,185,129,.35);
        }

        .thumb {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: cover;
            background: #020617;
        }

        .hidden-force {
            display: none !important;
        }

    </style>
</head>

<body class="min-h-screen">

<!-- LOGIN -->

<div id="loginScreen"
     class="fixed inset-0 z-[100] flex items-center justify-center p-5">

    <div class="absolute inset-0 bg-slate-950"></div>

    <div class="glass relative w-full max-w-md rounded-2xl p-7 shadow-2xl">

        <div class="text-center mb-7">

            <div
                class="mx-auto mb-4 w-14 h-14 rounded-2xl bg-emerald-500/10
                       flex items-center justify-center text-emerald-400 text-2xl">

                <i class="fa-solid fa-vault"></i>

            </div>

            <h1 class="text-2xl font-extrabold">
                ZK Vault
            </h1>

            <p class="text-slate-400 text-sm mt-2">
                Private Online Canvas Vault
            </p>

        </div>

        <div class="space-y-4">

            <input
                id="loginEmail"
                type="email"
                class="input"
                placeholder="Email">

            <input
                id="loginPassword"
                type="password"
                class="input"
                placeholder="Password">

            <button
                onclick="login()"
                class="btn btn-green w-full">

                <i class="fa-solid fa-right-to-bracket mr-2"></i>
                Login

            </button>

            <button
                onclick="registerAccount()"
                class="btn btn-dark w-full">

                Buat Akun

            </button>

        </div>

        <div
            id="loginStatus"
            class="text-center text-sm mt-5 text-slate-400">
        </div>

    </div>

</div>


<!-- APP -->

<div id="app"
     class="hidden min-h-screen">

    <!-- HEADER -->

    <header
        class="sticky top-0 z-40 border-b border-slate-800/80
               bg-slate-950/90 backdrop-blur-xl">

        <div
            class="max-w-7xl mx-auto px-4 py-4
                   flex flex-col lg:flex-row
                   lg:items-center lg:justify-between gap-4">

            <div>

                <div class="flex items-center gap-3">

                    <div
                        class="w-10 h-10 rounded-xl
                               bg-emerald-500/10
                               flex items-center justify-center
                               text-emerald-400">

                        <i class="fa-solid fa-vault"></i>

                    </div>

                    <div>

                        <h1 class="font-extrabold text-lg">
                            ZK Vault
                        </h1>

                        <p class="text-xs text-slate-500">
                            Online Canvas Tracker
                        </p>

                    </div>

                </div>

            </div>


            <div class="flex flex-wrap gap-2">

                <button
                    onclick="backupVault()"
                    class="btn btn-dark">

                    <i class="fa-solid fa-download mr-1"></i>
                    Backup

                </button>

                <button
                    onclick="document.getElementById('restoreFile').click()"
                    class="btn btn-dark">

                    <i class="fa-solid fa-upload mr-1"></i>
                    Restore

                </button>

                <input
                    id="restoreFile"
                    type="file"
                    accept=".json"
                    class="hidden"
                    onchange="restoreVault(event)">

                <button
                    onclick="openNewProject()"
                    class="btn btn-green">

                    <i class="fa-solid fa-plus mr-1"></i>
                    Canvas Baru

                </button>

                <button
                    onclick="logout()"
                    class="btn btn-red">

                    <i class="fa-solid fa-right-from-bracket mr-1"></i>
                    Logout

                </button>

            </div>

        </div>

    </header>


    <!-- MAIN -->

    <main class="max-w-7xl mx-auto px-4 py-7">

        <div
            class="glass rounded-2xl p-4 mb-6
                   flex flex-col md:flex-row gap-3
                   md:items-center md:justify-between">

            <div>

                <div class="font-semibold">
                    Cloud Vault
                </div>

                <div
                    id="syncStatus"
                    class="text-xs text-slate-500 mt-1">

                    Menghubungkan...

                </div>

            </div>

            <div class="relative w-full md:w-80">

                <i
                    class="fa-solid fa-search absolute left-3 top-3.5
                           text-slate-500">
                </i>

                <input
                    id="searchInput"
                    oninput="renderProjects()"
                    class="input pl-10"
                    placeholder="Cari project...">

            </div>

        </div>


        <!-- PROJECT LIST -->

        <div
            id="projectGrid"
            class="grid grid-cols-1 sm:grid-cols-2
                   lg:grid-cols-3 xl:grid-cols-4 gap-5">

        </div>


        <div
            id="emptyState"
            class="hidden text-center py-20">

            <div
                class="text-5xl text-slate-700 mb-5">

                <i class="fa-solid fa-box-open"></i>

            </div>

            <h2 class="text-lg font-bold">
                Belum ada project
            </h2>

            <p class="text-slate-500 text-sm mt-2">
                Tambahkan Canvas pertama Anda.
            </p>

        </div>

    </main>

</div>


<!-- PROJECT MODAL -->

<div
    id="projectModal"
    class="hidden fixed inset-0 z-50 modal-bg
           flex items-center justify-center p-4">

    <div
        class="glass w-full max-w-3xl
               max-h-[92vh] overflow-y-auto
               rounded-2xl p-6">

        <div
            class="flex items-center justify-between mb-6">

            <h2
                id="modalTitle"
                class="text-xl font-bold">

                Canvas Baru

            </h2>

            <button
                onclick="closeModal()"
                class="text-slate-400 hover:text-white">

                <i class="fa-solid fa-xmark text-xl"></i>

            </button>

        </div>


        <input
            type="hidden"
            id="projectId">


        <div class="space-y-5">

            <div>

                <label class="block text-sm font-semibold mb-2">
                    Nama Project
                </label>

                <input
                    id="projectTitle"
                    class="input"
                    placeholder="Contoh: ZK Metadata">

            </div>


            <div>

                <label class="block text-sm font-semibold mb-2">
                    Link Gemini / Canvas
                </label>

                <input
                    id="canvasLink"
                    class="input"
                    placeholder="https://...">

            </div>


            <div>

                <label class="block text-sm font-semibold mb-2">
                    Thumbnail
                </label>

                <input
                    id="thumbnailInput"
                    type="file"
                    accept="image/*"
                    class="input">

                <div
                    id="thumbnailPreview"
                    class="mt-3">
                </div>

            </div>


            <div>

                <label class="block text-sm font-semibold mb-2">
                    Version / Code
                </label>

                <input
                    id="versionName"
                    class="input mb-3"
                    placeholder="Contoh: V1">

                <textarea
                    id="versionLog"
                    class="input mb-3"
                    rows="3"
                    placeholder="Catatan perubahan..."></textarea>

                <textarea
                    id="versionCode"
                    class="input font-mono text-xs"
                    rows="12"
                    placeholder="Paste code Canvas di sini..."></textarea>

            </div>


            <div
                id="existingHistory"
                class="space-y-2">
            </div>


            <div
                class="flex flex-wrap justify-end gap-2 pt-3">

                <button
                    onclick="closeModal()"
                    class="btn btn-dark">

                    Batal

                </button>

                <button
                    onclick="saveProject()"
                    class="btn btn-green">

                    <i class="fa-solid fa-cloud-arrow-up mr-1"></i>
                    Simpan Online

                </button>

            </div>

        </div>

    </div>

</div>


<script>

/* =========================================================
   SUPABASE CONFIG
   ========================================================= */

const SUPABASE_URL =
    "MASUKKAN_PROJECT_URL_ANDA";

const SUPABASE_ANON_KEY =
    "MASUKKAN_ANON_KEY_ANDA";


const { createClient } = supabase;

const db = createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);


/* =========================================================
   LOCAL STORAGE
   ========================================================= */

const VAULT_STORAGE_KEY =
    "zk_vault_canvases_clean";


let projects = [];

let currentUser = null;

let editingProject = null;


/* =========================================================
   INIT
   ========================================================= */

async function init() {

    if (
        SUPABASE_URL.includes("MASUKKAN_") ||
        SUPABASE_ANON_KEY.includes("MASUKKAN_")
    ) {

        document.getElementById("loginStatus").innerHTML =
            `<span class="text-red-400">
                Isi SUPABASE_URL dan SUPABASE_ANON_KEY terlebih dahulu.
             </span>`;

        return;
    }


    const {
        data: {
            session
        }
    } = await db.auth.getSession();


    if (session) {

        currentUser =
            session.user;

        showApp();

        await loadProjects();

    }


    db.auth.onAuthStateChange(
        async (event, session) => {

            if (session) {

                currentUser =
                    session.user;

                showApp();

                await loadProjects();

            } else {

                currentUser =
                    null;

                showLogin();

            }

        }
    );

}


init();


/* =========================================================
   LOGIN
   ========================================================= */

async function login() {

    const email =
        document.getElementById("loginEmail").value.trim();

    const password =
        document.getElementById("loginPassword").value;


    if (!email || !password) {

        setLoginStatus(
            "Email dan password wajib diisi.",
            true
        );

        return;
    }


    setLoginStatus("Login...");


    const {
        error
    } = await db.auth.signInWithPassword({

        email,
        password

    });


    if (error) {

        setLoginStatus(
            error.message,
            true
        );

    }

}


async function registerAccount() {

    const email =
        document.getElementById("loginEmail").value.trim();

    const password =
        document.getElementById("loginPassword").value;


    if (!email || !password) {

        setLoginStatus(
            "Isi email dan password terlebih dahulu.",
            true
        );

        return;
    }


    if (password.length < 6) {

        setLoginStatus(
            "Password minimal 6 karakter.",
            true
        );

        return;
    }


    setLoginStatus("Membuat akun...");


    const {
        error
    } = await db.auth.signUp({

        email,
        password

    });


    if (error) {

        setLoginStatus(
            error.message,
            true
        );

        return;
    }


    setLoginStatus(
        "Akun dibuat. Jika email confirmation aktif, cek email Anda."
    );

}


function setLoginStatus(
    message,
    error = false
) {

    const el =
        document.getElementById("loginStatus");

    el.textContent =
        message;

    el.className =
        "text-center text-sm mt-5 " +
        (error
            ? "text-red-400"
            : "text-emerald-400");

}


async function logout() {

    await db.auth.signOut();

}


/* =========================================================
   SCREEN
   ========================================================= */

function showApp() {

    document
        .getElementById("loginScreen")
        .classList.add("hidden");

    document
        .getElementById("app")
        .classList.remove("hidden");

}


function showLogin() {

    document
        .getElementById("loginScreen")
        .classList.remove("hidden");

    document
        .getElementById("app")
        .classList.add("hidden");

}


/* =========================================================
   LOAD ONLINE PROJECTS
   ========================================================= */

async function loadProjects() {

    setSyncStatus(
        "Mengambil data dari cloud..."
    );


    const {
        data,
        error
    } = await db
        .from("projects")
        .select("*")
        .order(
            "updated_at",
            {
                ascending: false
            }
        );


    if (error) {

        console.error(error);

        setSyncStatus(
            "Gagal mengambil data: " +
            error.message,
            true
        );

        return;
    }


    projects =
        data.map(row => ({

            id:
                row.id,

            title:
                row.title,

            canvasLink:
                row.canvas_link,

            image:
                row.image,

            history:
                row.history || [],

            activeVersionIdx:
                row.active_version_idx || 0,

            created_at:
                row.created_at,

            updated_at:
                row.updated_at

        }));


    renderProjects();


    setSyncStatus(
        `${projects.length} project tersimpan online`
    );

}


/* =========================================================
   RENDER
   ========================================================= */

function renderProjects() {

    const grid =
        document.getElementById("projectGrid");

    const empty =
        document.getElementById("emptyState");


    const query =
        document
            .getElementById("searchInput")
            .value
            .toLowerCase()
            .trim();


    const filtered =
        projects.filter(project =>

            project.title
                .toLowerCase()
                .includes(query)

        );


    grid.innerHTML = "";


    if (!filtered.length) {

        empty.classList.remove("hidden");

        return;

    }


    empty.classList.add("hidden");


    filtered.forEach(project => {

        const historyCount =
            project.history?.length || 0;


        const card =
            document.createElement("div");


        card.className =
            "project-card glass rounded-2xl overflow-hidden";


        card.innerHTML = `

            ${
                project.image
                ?
                `<img
                    src="${escapeAttr(project.image)}"
                    class="thumb">`
                :
                `<div
                    class="thumb flex items-center
                           justify-center text-slate-700
                           text-4xl">

                    <i class="fa-solid fa-code"></i>

                 </div>`
            }


            <div class="p-4">

                <div
                    class="font-bold truncate"
                    title="${escapeAttr(project.title)}">

                    ${escapeHtml(project.title)}

                </div>


                <div
                    class="text-xs text-slate-500 mt-1">

                    ${historyCount}
                    version

                </div>


                <div
                    class="flex flex-wrap gap-2 mt-4">

                    ${
                        project.canvasLink
                        ?
                        `<button
                            onclick="openCanvas('${project.id}')"
                            class="btn btn-green text-xs">

                            <i class="fa-solid fa-arrow-up-right-from-square mr-1"></i>
                            Canvas

                         </button>`
                        :
                        ""
                    }


                    <button
                        onclick="editProject('${project.id}')"
                        class="btn btn-dark text-xs">

                        <i class="fa-solid fa-pen mr-1"></i>
                        Edit

                    </button>


                    <button
                        onclick="deleteProject('${project.id}')"
                        class="btn btn-red text-xs">

                        <i class="fa-solid fa-trash mr-1"></i>
                        Hapus

                    </button>

                </div>

            </div>

        `;


        grid.appendChild(card);

    });

}


/* =========================================================
   NEW PROJECT
   ========================================================= */

function openNewProject() {

    editingProject = null;


    document.getElementById("modalTitle")
        .textContent = "Canvas Baru";


    document.getElementById("projectId")
        .value = "";


    document.getElementById("projectTitle")
        .value = "";


    document.getElementById("canvasLink")
        .value = "";


    document.getElementById("versionName")
        .value = "V1";


    document.getElementById("versionLog")
        .value = "";


    document.getElementById("versionCode")
        .value = "";


    document.getElementById("thumbnailInput")
        .value = "";


    document.getElementById("thumbnailPreview")
        .innerHTML = "";


    document.getElementById("existingHistory")
        .innerHTML = "";


    document
        .getElementById("projectModal")
        .classList.remove("hidden");

}


/* =========================================================
   EDIT PROJECT
   ========================================================= */

function editProject(id) {

    const project =
        projects.find(
            p => p.id === id
        );


    if (!project)
        return;


    editingProject =
        project;


    document.getElementById("modalTitle")
        .textContent = "Edit Project";


    document.getElementById("projectId")
        .value = project.id;


    document.getElementById("projectTitle")
        .value = project.title || "";


    document.getElementById("canvasLink")
        .value = project.canvasLink || "";


    document.getElementById("versionName")
        .value =
        "V" +
        ((project.history?.length || 0) + 1);


    document.getElementById("versionLog")
        .value = "";


    document.getElementById("versionCode")
        .value = "";


    document.getElementById("thumbnailInput")
        .value = "";


    if (project.image) {

        document.getElementById(
            "thumbnailPreview"
        ).innerHTML = `

            <img
                src="${escapeAttr(project.image)}"
                class="max-h-40 rounded-xl border border-slate-700">

        `;

    } else {

        document.getElementById(
            "thumbnailPreview"
        ).innerHTML = "";

    }


    renderHistory(project);


    document
        .getElementById("projectModal")
        .classList.remove("hidden");

}


/* =========================================================
   HISTORY
   ========================================================= */

function renderHistory(project) {

    const container =
        document.getElementById("existingHistory");


    if (!project.history?.length) {

        container.innerHTML = "";

        return;

    }


    container.innerHTML = `

        <div
            class="text-sm font-semibold text-slate-300">

            Version History

        </div>

        ${
            project.history
            .map((v, index) => `

                <div
                    class="border border-slate-800
                           rounded-xl p-3">

                    <div
                        class="flex items-center
                               justify-between gap-3">

                        <div>

                            <div
                                class="font-semibold text-sm">

                                ${escapeHtml(
                                    v.version ||
                                    "Version " +
                                    (index + 1)
                                )}

                            </div>

                            <div
                                class="text-xs text-slate-500 mt-1">

                                ${escapeHtml(
                                    v.date || ""
                                )}

                            </div>

                        </div>


                        <button
                            onclick="loadVersion(${index})"
                            class="btn btn-dark text-xs">

                            Gunakan

                        </button>

                    </div>

                    ${
                        v.log
                        ?
                        `<div
                            class="text-xs text-slate-400 mt-2">

                            ${escapeHtml(v.log)}

                         </div>`
                        :
                        ""
                    }

                </div>

            `)
            .join("")
        }

    `;

}


function loadVersion(index) {

    if (!editingProject)
        return;


    const version =
        editingProject.history[index];


    if (!version)
        return;


    document.getElementById("versionName")
        .value =
        version.version || "";


    document.getElementById("versionLog")
        .value =
        version.log || "";


    document.getElementById("versionCode")
        .value =
        version.code || "";

}


/* =========================================================
   SAVE PROJECT
   ========================================================= */

async function saveProject() {

    const title =
        document
            .getElementById("projectTitle")
            .value
            .trim();


    const canvasLink =
        document
            .getElementById("canvasLink")
            .value
            .trim();


    const versionName =
        document
            .getElementById("versionName")
            .value
            .trim();


    const versionLog =
        document
            .getElementById("versionLog")
            .value
            .trim();


    const versionCode =
        document
            .getElementById("versionCode")
            .value;


    if (!title) {

        alert("Nama project wajib diisi.");

        return;
    }


    let image =
        editingProject?.image || "";


    const file =
        document
            .getElementById("thumbnailInput")
            .files[0];


    if (file) {

        image =
            await fileToDataURL(file);

    }


    const newVersion = {

        version:
            versionName ||
            "V" +
            ((editingProject?.history?.length || 0) + 1),

        log:
            versionLog,

        code:
            versionCode,

        date:
            new Date().toLocaleString("id-ID")

    };


    let history =
        editingProject?.history
        ?
        [...editingProject.history]
        :
        [];


    /*
        Hanya tambahkan version baru
        kalau user benar-benar memasukkan
        code / log.
    */

    if (
        versionCode.trim() ||
        versionLog.trim()
    ) {

        history.push(
            newVersion
        );

    }


    const payload = {

        title,

        canvas_link:
            canvasLink,

        image,

        history,

        active_version_idx:
            Math.max(
                0,
                history.length - 1
            ),

        user_id:
            currentUser.id

    };


    setSyncStatus(
        "Menyimpan ke cloud..."
    );


    let result;


    if (editingProject) {

        result =
            await db
                .from("projects")
                .update({

                    title:
                        payload.title,

                    canvas_link:
                        payload.canvas_link,

                    image:
                        payload.image,

                    history:
                        payload.history,

                    active_version_idx:
                        payload.active_version_idx,

                    updated_at:
                        new Date().toISOString()

                })
                .eq(
                    "id",
                    editingProject.id
                )
                .eq(
                    "user_id",
                    currentUser.id
                );

    } else {

        result =
            await db
                .from("projects")
                .insert(payload);

    }


    if (result.error) {

        console.error(
            result.error
        );


        setSyncStatus(
            "Gagal menyimpan: " +
            result.error.message,
            true
        );


        alert(
            "Gagal menyimpan:\n\n" +
            result.error.message
        );


        return;

    }


    closeModal();


    await loadProjects();


    /*
        Simpan juga cache lokal.
        Ini bukan database utama.
        Hanya fallback / cache.
    */

    try {

        localStorage.setItem(
            VAULT_STORAGE_KEY,
            JSON.stringify(
                projects
            )
        );

    } catch (e) {

        console.warn(
            "Local cache gagal:",
            e
        );

    }

}


/* =========================================================
   DELETE
   ========================================================= */

async function deleteProject(id) {

    const project =
        projects.find(
            p => p.id === id
        );


    if (!project)
        return;


    const ok =
        confirm(
            `Hapus project "${project.title}" dari Vault online?`
        );


    if (!ok)
        return;


    setSyncStatus(
        "Menghapus..."
    );


    const {
        error
    } = await db
        .from("projects")
        .delete()
        .eq(
            "id",
            id
        )
        .eq(
            "user_id",
            currentUser.id
        );


    if (error) {

        alert(
            "Gagal menghapus:\n\n" +
            error.message
        );

        return;

    }


    await loadProjects();

}


/* =========================================================
   OPEN CANVAS
   ========================================================= */

function openCanvas(id) {

    const project =
        projects.find(
            p => p.id === id
        );


    if (
        project &&
        project.canvasLink
    ) {

        window.open(
            project.canvasLink,
            "_blank",
            "noopener,noreferrer"
        );

    }

}


/* =========================================================
   MODAL
   ========================================================= */

function closeModal() {

    document
        .getElementById("projectModal")
        .classList.add("hidden");

}


/* =========================================================
   BACKUP
   ========================================================= */

function backupVault() {

    const backup = {

        app:
            "ZK Vault",

        type:
            "canvas-project-backup",

        backupVersion:
            "2.0",

        exportedAt:
            new Date().toISOString(),

        totalProjects:
            projects.length,

        projects:
            projects

    };


    const blob =
        new Blob(
            [
                JSON.stringify(
                    backup,
                    null,
                    2
                )
            ],
            {
                type:
                    "application/json"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const a =
        document.createElement("a");


    const date =
        new Date()
            .toISOString()
            .slice(0, 10);


    a.href =
        url;


    a.download =
        `zk-vault-online-backup-${date}.json`;


    document.body.appendChild(a);


    a.click();


    a.remove();


    URL.revokeObjectURL(url);

}


/* =========================================================
   RESTORE
   ========================================================= */

async function restoreVault(event) {

    const file =
        event.target.files[0];


    if (!file)
        return;


    try {

        const text =
            await file.text();


        const backup =
            JSON.parse(text);


        if (
            !backup ||
            backup.type !==
            "canvas-project-backup"
        ) {

            alert(
                "File backup ZK Vault tidak valid."
            );

            return;

        }


        if (
            !Array.isArray(
                backup.projects
            )
        ) {

            alert(
                "Data project tidak ditemukan."
            );

            return;

        }


        const ok =
            confirm(
                `Restore ${backup.projects.length} project ke Vault online?\n\nProject yang sedang ada tidak akan langsung dihapus.`
            );


        if (!ok)
            return;


        setSyncStatus(
            "Mengimport backup..."
        );


        let success =
            0;


        for (
            const project
            of backup.projects
        ) {

            const payload = {

                user_id:
                    currentUser.id,

                title:
                    project.title || "",

                canvas_link:
                    project.canvasLink || "",

                image:
                    project.image || "",

                history:
                    project.history || [],

                active_version_idx:
                    project.activeVersionIdx || 0

            };


            const {
                error
            } = await db
                .from("projects")
                .insert(payload);


            if (!error) {

                success++;

            } else {

                console.error(
                    error
                );

            }

        }


        await loadProjects();


        alert(
            `Restore selesai.\n\nBerhasil: ${success}\nTotal: ${backup.projects.length}`
        );


    } catch (error) {

        console.error(error);

        alert(
            "Gagal membaca file backup."
        );

    }


    event.target.value = "";

}


/* =========================================================
   OLD LOCAL DATA MIGRATION
   ========================================================= */

async function migrateOldLocalStorage() {

    const raw =
        localStorage.getItem(
            VAULT_STORAGE_KEY
        );


    if (!raw)
        return;


    let oldProjects;


    try {

        oldProjects =
            JSON.parse(raw);

    } catch {

        return;

    }


    if (
        !Array.isArray(
            oldProjects
        ) ||
        !oldProjects.length
    ) {

        return;

    }


    const answer =
        confirm(
            `Ditemukan ${oldProjects.length} project lama di browser ini.\n\nImport ke Vault Online sekarang?`
        );


    if (!answer)
        return;


    setSyncStatus(
        "Memindahkan project lama ke cloud..."
    );


    let success =
        0;


    for (
        const project
        of oldProjects
    ) {

        const payload = {

            user_id:
                currentUser.id,

            title:
                project.title || "",

            canvas_link:
                project.canvasLink || "",

            image:
                project.image || "",

            history:
                project.history || [],

            active_version_idx:
                project.activeVersionIdx || 0

        };


        const {
            error
        } = await db
            .from("projects")
            .insert(payload);


        if (!error) {

            success++;

        }

    }


    await loadProjects();


    alert(
        `Migrasi selesai.\n\nBerhasil: ${success} project.`
    );

}


/* =========================================================
   UTILITY
   ========================================================= */

function fileToDataURL(file) {

    return new Promise(
        (resolve, reject) => {

            const reader =
                new FileReader();


            reader.onload =
                () =>
                    resolve(
                        reader.result
                    );


            reader.onerror =
                reject;


            reader.readAsDataURL(
                file
            );

        }
    );

}


function escapeHtml(value) {

    return String(
        value ?? ""
    )
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


function escapeAttr(value) {

    return escapeHtml(
        value
    );

}


function setSyncStatus(
    message,
    error = false
) {

    const el =
        document.getElementById(
            "syncStatus"
        );


    el.textContent =
        message;


    el.className =
        "text-xs mt-1 " +
        (
            error
            ? "text-red-400"
            : "text-emerald-400"
        );

}


/* =========================================================
   AUTO MIGRATION
   ========================================================= */

async function checkMigration() {

    if (!currentUser)
        return;


    const {
        count,
        error
    } = await db
        .from("projects")
        .select(
            "id",
            {
                count: "exact",
                head: true
            }
        );


    if (error)
        return;


    const old =
        localStorage.getItem(
            VAULT_STORAGE_KEY
        );


    if (
        old &&
        count === 0
    ) {

        setTimeout(
            migrateOldLocalStorage,
            1000
        );

    }

}
